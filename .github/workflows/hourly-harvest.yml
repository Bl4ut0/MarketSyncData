name: Hourly Auction Harvester

on:
  schedule:
    # Off-peak minutes (:12 with a :42 backup retry if GitHub delays/drops :12 under load)
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read Blizzard and report results without publishing datasets
        type: boolean
        default: false
      analytics_only:
        description: Publish analytics from existing captures without requesting Blizzard data
        type: boolean
        default: false

concurrency:
  group: harvest-group
  cancel-in-progress: false

jobs:
  harvest:
    name: Harvest Hourly Auction Block
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Current UTC Hour Status
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANALYTICS_ONLY: ${{ inputs.analytics_only }}
        run: |
          if [ "$ANALYTICS_ONLY" = "true" ]; then
            echo "Using existing captures for analytics."
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "schedule" ] && node scripts/check-hour.js; then
            echo "All editions have a usable capture for this UTC hour."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: npm ci

      - name: Harvest Hourly Dataset Block
        if: steps.check.outputs.should_run == 'true'
        env:
          BLIZZARD_REGION: 'us'
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REQUIRE_LIVE_HARVEST: '1'
          DATASETS_DIR: ${{ inputs.diagnostic_only && format('{0}/marketsync-diagnostic', runner.temp) || '' }}
        run: npm run harvest

      - name: Publish Market Analytics Reports
        if: '!inputs.diagnostic_only'
        continue-on-error: true
        run: node scripts/prepare-analytics.js

      - name: Commit Hourly Dataset Block
        if: '!inputs.diagnostic_only'
        run: |
          git config --local user.name "MarketSync Harvester"
          git config --local user.email "harvester@marketsync.local"
          git add datasets/
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "chore(data): record hourly auction dataset block ($TIMESTAMP)" || echo "No changes to commit"
          git push
