name: Daily Dataset Compile & Release

on:
  schedule:
    # Run once daily at 06:20 UTC (off-peak minute to avoid top-of-hour runner queues)
    - cron: '27 6 * * *'
  workflow_dispatch:

concurrency:
  group: compile-group
  cancel-in-progress: false

jobs:
  compile-and-release:
    name: Compile Daily DataPack & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Pipeline Tests
        run: npm test

      - name: Compile Daily 90-Day Datasets
        run: npm run compile

      - name: Set Release Tag
        id: vars
        run: |
          DATE_TAG=$(date -u +"%Y.%m.%d")
          ISO_DATE=$(date -u +"%Y-%m-%d")
          echo "tag=v${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "iso_date=${ISO_DATE}" >> $GITHUB_OUTPUT

      - name: Package Per-Flavor Distribution Archives
        run: node scripts/package.js "${{ steps.vars.outputs.iso_date }}"

      - name: Commit Compiled Dataset & TOC
        run: |
          git config --local user.name "MarketSync Compiler"
          git config --local user.email "compiler@marketsync.local"
          git add MarketSyncData/
          git commit -m "chore(release): compile daily dataset pack (${{ steps.vars.outputs.date }})" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "MarketSyncData ${{ steps.vars.outputs.date }}"
          body: |
            ## MarketSyncData Daily Auction Packs (${{ steps.vars.outputs.date }})
            
            Compiled 90-day rolling auction house & commodity pricing packs for all supported World of Warcraft versions.
            Each release archive contains **strictly its own flavor's dataset** trimmed to the latest 90 days (while full hourly snapshots remain archived in GitHub under `datasets/`):
            
            - Forever packs are released separately as one archive per ruleset and faction (`MarketSyncData_Forever_<ruleset>_<faction>`), built by the Forever data packs workflow.
            - `MSData-Anniversary-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Anniversary** (`dreamscythe`, `nightslayer`, `maladath`)
            - `MSData-ClassicEra-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Era / SoD / Hardcore** (Interface `11509`, `11508`)
            - `MSData-Classic-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Progression** (Interface `50503`, `38000`, `20506`, `20505`)
            - `MSData-Retail-${{ steps.vars.outputs.iso_date }}.zip` — **Retail** (Interface `120001`, `120000`)
            
            ### Installation:
            Download the archive matching your game version and extract the `MarketSyncData` folder into your client's `Interface/AddOns/` directory alongside `MarketSync`.
          files: |
            dist/MSData-Anniversary-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-ClassicEra-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-Classic-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-Retail-${{ steps.vars.outputs.iso_date }}.zip
            dist/compile-summary.json

      - name: Upload to CurseForge (Optional)
        if: env.CURSEFORGE_TOKEN != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1824426'
          RELEASE_DATE: ${{ steps.vars.outputs.iso_date }}
        run: |
          endpoint=https://wow.curseforge.com/api
          catalog=$(curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" "$endpoint/game/wow/versions")

          # An overlapping TOC interface does not make the datasets interchangeable.
          # Assign Anniversary and Era their own tags; keep Progression separate.
          targets='{
            "Forever": ["1.60.1"],
            "Anniversary": ["2.5.5", "2.5.6"],
            "ClassicEra": ["1.15.8", "1.15.9"],
            "Classic": ["3.8.0", "5.5.3"],
            "Retail": ["12.0.0", "12.0.1"]
          }'

          plans=$(jq -cen --argjson catalog "$catalog" --argjson targets "$targets" \
            --slurpfile summary dist/compile-summary.json '
            [$summary[0].flavors[] | select(.totalUniqueItems > 0) | .label as $label |
              ($targets[$label] // error("Unknown release flavor: " + $label)) as $names |
              [$names[] as $name |
                [$catalog[] | select(.name == $name and
                  ($label != "Forever" or .gameVersionTypeID == 88568)) | .id] | unique |
                if length > 1 then error("Ambiguous CurseForge version: " + $name) else .[] end
              ] as $ids |
              if ($ids | length) == 0 then error("No CurseForge versions for " + $label)
              else {label: $label, ids: $ids} end
            ]')

          while IFS= read -r plan; do
            label=$(jq -r '.label' <<< "$plan")
            # Forever has its own per-pack projects (forever-packs workflow); skip it here.
            if [ "$label" = "Forever" ]; then continue; fi
            archive="dist/MSData-$label-$RELEASE_DATE.zip"
            test -s "$archive"
            metadata=$(jq -cn --arg label "$label" --arg date "$RELEASE_DATE" \
              --argjson ids "$(jq -c '.ids' <<< "$plan")" '
              {displayName: ("MarketSyncData " + $label + " " + $date),
               changelog: ("Daily Auction House price history for " + $label + "."),
               changelogType: "markdown", releaseType: "release", gameVersions: $ids}')
            response=$(curl --fail-with-body --silent --show-error \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              -F "metadata=$metadata" -F "file=@$archive" \
              "$endpoint/projects/$CURSEFORGE_PROJECT_ID/upload-file")
            file_id=$(jq -er '.id | numbers' <<< "$response")
            echo "Uploaded $archive as CurseForge file $file_id"
          done < <(jq -c '.[]' <<< "$plans")
