name: Daily Dataset Compile & Release

on:
  schedule:
    # Run once daily at 06:20 UTC (off-peak minute to avoid top-of-hour runner queues)
    - cron: '20 6 * * *'
  workflow_dispatch:

concurrency:
  group: compile-group
  cancel-in-progress: false

jobs:
  compile-and-release:
    name: Compile Daily DataPack & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Pipeline Tests
        run: npm test

      - name: Compile Daily 90-Day Datasets
        run: npm run compile

      - name: Set Release Tag
        id: vars
        run: |
          DATE_TAG=$(date -u +"%Y.%m.%d")
          ISO_DATE=$(date -u +"%Y-%m-%d")
          echo "tag=v${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "iso_date=${ISO_DATE}" >> $GITHUB_OUTPUT

      - name: Package Per-Flavor Distribution Archives
        run: node scripts/package.js "${{ steps.vars.outputs.iso_date }}"

      - name: Commit Compiled Dataset & TOC
        run: |
          git config --local user.name "MarketSync Compiler"
          git config --local user.email "compiler@marketsync.local"
          git add MarketSyncData/ dist/compile-summary.json
          git commit -m "chore(release): compile daily dataset pack (${{ steps.vars.outputs.date }})" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "MarketSyncData ${{ steps.vars.outputs.date }}"
          body: |
            ## MarketSyncData Daily Auction Packs (${{ steps.vars.outputs.date }})
            
            Compiled 90-day rolling auction house & commodity pricing packs for all supported World of Warcraft versions.
            Each release archive contains **strictly its own flavor's dataset** trimmed to the latest 90 days (while full hourly snapshots remain archived in GitHub under `datasets/`):
            
            - `MSData-Forever-${{ steps.vars.outputs.iso_date }}.zip` — **WoW: Forever** (Interface `16001` — PvP, Normal, RP, RP-PvP)
            - `MSData-Anniversary-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Anniversary** (`dreamscythe`, `nightslayer`, `maladath`)
            - `MSData-ClassicEra-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Era / SoD / Hardcore** (Interface `11509`, `11508`)
            - `MSData-Classic-${{ steps.vars.outputs.iso_date }}.zip` — **Classic Progression** (Interface `50503`, `38000`, `20506`, `20505`)
            - `MSData-Retail-${{ steps.vars.outputs.iso_date }}.zip` — **Retail** (Interface `120001`, `120000`)
            
            ### Installation:
            Download the archive matching your game version and extract the `MarketSyncData` folder into your client's `Interface/AddOns/` directory alongside `MarketSync`.
          files: |
            dist/MSData-Forever-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-Anniversary-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-ClassicEra-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-Classic-${{ steps.vars.outputs.iso_date }}.zip
            dist/MSData-Retail-${{ steps.vars.outputs.iso_date }}.zip
            dist/compile-summary.json

      - name: Upload to CurseForge (Optional)
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          echo "CurseForge token found. Submitting per-flavor releases to CurseForge API..."
          for ARCHIVE in dist/MSData-*-${{ steps.vars.outputs.iso_date }}.zip; do
            echo "Uploading $ARCHIVE..."
            METADATA=$(cat <<EOF
          {
            "changelog": "Daily 90-day compiled auction pricing data pack for ${{ steps.vars.outputs.date }} ($(basename "$ARCHIVE")).",
            "changelogType": "markdown",
            "releaseType": "release",
            "gameVersions": [116001, 11509, 20506, 50503, 120001]
          }
          EOF
            )
            curl -s -X POST "https://wow.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file" \
              -H "x-api-token: ${CURSEFORGE_TOKEN}" \
              -F "metadata=${METADATA}" \
              -F "file=@${ARCHIVE}" || true
          done
